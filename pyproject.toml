[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "briefmint-skillpay"
version = "1.0.0"
description = "Source-bounded project briefs with an auditable payment-gated JSON API"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
briefmint = "briefmint.__main__:main"

[tool.setuptools.packages.find]
include = ["briefmint*"]
